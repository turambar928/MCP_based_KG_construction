<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img">
<title>Dual-strategy rule generation</title><desc>A fire-enforcement document supplies two generation branches. Deletion supplies original text, masked text and removed fragments. Augmentation generates supplementary clauses and rules in one response. Both retain provenance; exact typed patterns enter a separate offline execution bridge. English examples are shortened translations from archived document E06FCBC8B4E263C04595AD197B9A8718.</desc>
