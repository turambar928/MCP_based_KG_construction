局。承办机构：法规与行政审批处。实施依据：《陕西省水工程管理条例》（2018修正）第十五条：兴建铁路、公路、厂矿、铺设管道等，须挖掘、占用、利用、跨（穿）越水工程的设施的，建设单位应当征求工程管理单位与水工程所有者的意见，经有关部门批准，并与其签订协议后方可施工。。监管电话：02-86787392。责任事项：1.受理阶段责任：公示应当提交的材料，一次性告知补正材料，依法受理或不予受理（不予受理应当告知理由）。 2.审查阶段责任：审查申请材料，组织实地核查、专家评审，提出初步审查意见。 3.决定阶段责任：作出行政许可或不予行政许可决定，法定告知（不予许可的应当书面告知理由）。 4.送达阶段责任：登记许可结果；准予许可的制发许可文书；信息公开。 5.事后监督责任：依法建立实施监督检查的运行机制和管理制度，开展定期检查，采取监管措施。 6.其他法律法规政策规定应承担的责任。", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-fc4bd6117122:挖掘、占用、利用、跨（穿）越水工程设施建设活动批准", "relation": "服务事项", "tail": "挖掘、占用、利用、跨（穿）越水工程设施建设活动批准"}, {"head": "Document:government-fc4bd6117122:挖掘、占用、利用、跨（穿）越水工程设施建设活动批准", "relation": "权力类型", "tail": "行政许可"}, {"head": "Document:government-fc4bd6117122:挖掘、占用、利用、跨（穿）越水工程设施建设活动批准", "relation": "行驶主体", "tail": "西安市水务局"}, {"head": "Document:government-fc4bd6117122:挖掘、占用、利用、跨（穿）越水工程设施建设活动批准", "relation": "承办机构", "tail": "法规与行政审批处"}, {"head": "Document:government-fc4bd6117122:挖掘、占用、利用、跨（穿）越水工程设施建设活动批准", "relation": "实施依据", "tail": "《陕西省水工程管理条例》（2018修正）第十五条"}, {"head": "Document:government-fc4bd6117122:挖掘、占用、利用、跨（穿）越水工程设施建设活动批准", "relation": "监管电话", "tail": "02-86787392"}], "output_graph": null, "operation": "add", "triple": {"head": "Document:government-fc4bd6117122:挖掘、占用、利用、跨（穿）越水工程设施建设活动批准", "relation": "责任事项", "tail": "1.受理阶段责任：公示应当提交的材料，一次性告知补正材料，依法受理或不予受理（不予受理应当告知理由）。 2.审查阶段责任：审查申请材料，组织实地核查、专家评审，提出初步审查意见。 3.决定阶段责任：作出行政许可或不予行政许可决定，法定告知（不予许可的应当书面告知理由）。 4.送达阶段责任：登记许可结果；准予许可的制发许可文书；信息公开。 5.事后监督责任：依法建立实施监督检查的运行机制和管理制度，开展定期检查，采取监管措施。 6.其他法律法规政策规定应承担的责任。"}}, {"task": "D", "item_id": "NE-042", "source": "服务事项：对广告、画廊、牌匾、标语、霓虹灯、灯箱等破损、污浊或显示不全的；封闭阳台不符合规定的；停车场、点的环境卫生不符合规定的在责令改正期限内拒不改正的代为组织清理。权力类型：行政强制。行驶主体：西安市城市管理和综合执法局。承办机构：环境卫生管理处、广告牌匾管理处。实施依据：《西安市城市市容和环境卫生管理条例》（2020修正） 第五十条 违反本条例规定，有下列行为之一的，责令改正，并处50元以上500元以下罚款；有本条第二项、第六项和第八项行为之一，在责令改正期限内拒不改正的，城市管理部门可以组织清理，所需费用由责任人承担： （二）广告、画廊、牌匾、标语、霓虹灯、灯箱等破损、污浊或显示不全的； （六）封闭阳台不符合规定的； （八）停车场、点的环境卫生不符合规定的；。监管电话：02986788409。责任事项：1.催告阶段责任：审查当事人是否逾期不履行行政决定确定的义务；对逾期未履行的，催告当事人履行义务，制作催告书。 2.决定阶段责任：充分听取当事人的意见，对当事人提出的事实、理由、理由和证据，应当进行记录、复核；当事人提出的事实、理由或者证据成立的应当采纳。经催告，当事人逾期人不履行行政决定确定的义务，制作《行政强制执行决定书》，载明强制执行的理由和依据、强制执行的方式和时间、申请行政复议或者提起行政诉讼的途径和期限等。 3.执行阶段责任：《行政强制执行决定书》按法律规定的方式送达当事人。 4.事后监管责任：开展后续监督管理。 5.其他法律法规规章文件规定应履行的责任。", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [], "output_graph": null, "operation": "add", "triple": {"head": "Document:government-980dec4afb3d:对广告、画廊、牌匾、标语、霓虹灯、灯箱等破损、污浊或显示不全的；封闭阳台不符合规定的；停车场、点的环境卫生不符合规定的在责令改正期限内拒不改正的代为组织清理", "relation": "权力类型", "tail": "行政强制"}}, {"task": "D", "item_id": "NE-043", "source": "服务事项：外国人居留许可证核发。权力类型：行政许可。行驶主体：市公安局。承办机构：西安市公安局出入境管理处。实施依据：《中华人民共和国出境入境管理法》第三十条 外国人所持签证注明入境后需要办理居留证件的，应当自入境之日起三十日内，向拟居留地县级以上地方人民政府公安机关出入境管理机构申请办理外国人居留证件。 第三十一条 第二款符合国家规定的专门人才、投资者或者出于人道等原因确需由停留变更为居留的外国人，经设区的市级以上地方人民政府公安机关出入境管理机构批准可以办理外国人居留证件。 《外国人签证证件签发工作规范》第十六条：对外国人所持签证注明入境后需要办理居留证件、符合国家规定的专门人才和投资者以及出于人道和其他合理事由确需由停留变更为居留的，可以签发居留证件。申请材料和签发居留证件要求如下： （一）工作类：持Z字签证入境者应当提交当地人力资源和社会保。监管电话：029-110。责任事项：1．受理阶段责任：在办公场所公示收费标准；一次性告知补正材料；依法受理或不予受理（不予受理应当告知理由）。 2．审核阶段责任：材料审核（包括院校、企事业单位及公民个人出具的函件，我国驻外使领馆为被许可人个人出具的出生证、结婚证等相关资料的认证，并通过面谈、电话询问、实地调查等方式核实申请事由的真实性）；根据材料审核情况提出初审意见。 3．审批阶段责任：作出决定（不予核发居留许可的可不说明理由）；按时办结。 4．制证阶段责任：制发居留许可。 5．事后监督责任：加强证件签发后续管理。 6．其他法律法规政策规定应承担的责任。", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "服务事项", "tail": "外国人居留许可证核发"}, {"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "权力类型", "tail": "行政许可"}, {"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "行驶主体", "tail": "市公安局"}, {"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "承办机构", "tail": "西安市公安局出入境管理处"}, {"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "实施依据", "tail": "《中华人民共和国出境入境管理法》第三十条、第三十一条；《外国人签证证件签发工作规范》第十六条"}, {"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "监管电话", "tail": "029-110"}, {"head": "Document:gove 人作出行政处罚决定前应当进行法制审核。立", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [], "output_graph": null, "operation": "add", "triple": {"head": "Document:government-2b05bdf976f6:对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视", "relation": "权力类型", "tail": "行政处罚"}}, {"task": "D", "item_id": "NE-072", "source": "服务事项：对擅自在互联网上使用广播电视专有名称开展业务；变更股东、股权结构，或上市融资，或重大资产变动时，未办理审批手续；未建立健全节目运营规范，未采取版权保护措施，或对传播有害内容未履行提示、删除、报告义务；未在播出界面显著位置标注播出标识、名称、《许可证》和备案编号；未履行保留节目记录、向主管部门如实提供查询义务；向未持有《许可证》或备案的单位提供代收费及信号传输、服务器托管等与互联网视听节目服务有关的服务；未履行查验义务，或向互联网视听节目服务单位提供其《许可证》或备案载明事项范围以外的接入服务；进行虚假宣传或者误导用户；未经用户同意，擅自泄露用户信息秘密；互联网视听服务单位在同一年度内三次出现违规行为；拒绝、阻挠、拖延广播电影电视主管。权力类型：行政处罚。行驶主体：市级。承办机构：西安市文化市场综合执法支队。实施依据：《互联网视听节目服务管理规定》（2007年12月国家广播电影电视总局、信息产业部令第56号发布 根据2015年8月国家新闻出版广电总局令第3号第一次修正） 第二十三条：违反本规定有下列行为之一的，由县级以上广播电影电视主管部门予以警告、责令改正，可并处3万元以下罚款；同时，可对其主要出资者和经营者予以警告，可并处2万元以下罚款： （一）擅自在互联网上使用广播电视专有名称开展业务的；（二）变更股东、股权结构，或上市融资，或重大资产变动时，未办理审批手续的；（三）未建立健全节目运营规范，未采取版权保护措施，或对传播有害内容未履行提示、删除、报告义务的；（四）未在播出界面显著位置标注播出标识、名称、《许可证》和备案编号的；（五）未履行保留。监管电话：029-87425393。责任事项：1.立案阶段责任，按照线索和初步证据，依法立案。 2.调查阶段责任，调查后提出处理意见，向当事人发出行政处罚事先告知书。 3.审查阶段责任，审查拟处罚决定内容事实依据，如符合听证条件且当事人提出听证要求。按要求组织听证。 4.决定阶段责任，制作书面处罚决定并附送达回证。 5.告知阶段责任，告知申请人享有依法申请行政复议或者提起行政诉讼的权利。 6.送达阶段责任，向行政相对人发送达文书。 7.执行阶段责任，行政相对人执行行政处罚决定。", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [], "output_graph": null, "operation": "add", "triple": {"head": "Document:government-44de83980361:对擅自在互联网上使用广播电视专有名称开展业务；变更股东、股权结构，或上市融资，或重大资产变动时，未办理审批手续；未建立健全节目运营规范，未采取版权保护措施，或对传播有害内容未履行提示、删除、报告义务；", "relation": "实施依据", "tail": "《互联网视听节目服务管理规定》（2007年12月国家广播电影电视总局、信息产业部令第56号发布 根据2015年8月国家新闻出版广电总局令第3号第一次修正） 第二十三条：违反本规定有下列行为之一的，由县级以上广播电影电视主管部门予以警告、责令改正，可并处3万元以下罚款；同时，可对其主要出资者和经营者予以警告，可并处2万元以下罚款： （一）擅自在互联网上使用广播电视专有名称开展业务的；（二）变更股东、股权结构，或上市融资，或重大资产变动时，未办理审批手续的；（三）未建立健全节目运营规范，未采取版权保护措施，或对传播有害内容未履行提示、删除、报告义务的；（四）未在播出界面显著位置标注播出标识、名称、《许可证》和备案编号的；（五）未履行保留"}}, {"task": "D", "item_id": "NE-073", "source": "服务事项：对政府非税收入政策执行情况的检查。权力类型：行政检查。行驶主体：西安市财政局。承办机构：法规税政处。实施依据：《政府非税收入管理办法》（财税[2016]33号） 第三十四条 各级财政部门应当建立健全非税收入监督管理制度，加强非税收入政策执行情况的监督检查，依法处理非税收入违法违规行为。 第三十五条 执收单位应当建立健全内部控制制度，接受财政部门和审计机关的监督检查，如实提供非税收入情况和相关资料。。监管电话：029-89821870。责任事项：1.制定方案：制定监督工作规划。 2.实施检查：采取专项监督和日常监督相结合的方式。 3.处置：对于监督对象制定或者执行的规定与国家相关规定相抵触的，根据职权予以纠正或者建议有权机关予以纠正，依法对财政违法行为作出处理处罚 4.移送：对不属于本部门职权范围的事项，应当按照规定程序移送有权机关处理。 5.事后监管：向业务管理机构或专职监督机构反馈监督结果及意见。对监督对象财政违法行为作出的处理、处罚决定及其执行情况，除涉密外的依法进行公开。 6.其他：对于监督人员与监督对象有利害关系的应当回避；对财政违法行为举报人身份信息予以保密。", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "服务事项", "tail": "对政府非税收入政策执行情况的检查"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "权力类型", "tail": "行政检查"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "行驶主体", "tail": "西安市财政局"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "承办机构", "tail": "法规税政处"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "实施依据", "tail": "《政府非税收入管理办法》（财税[2016]33号）第三十四条 各级财政部门应当建立健全非税收入监督管理制度，加强非税收入政策执行情况的监督检查，依法处理非税收入违法违规行为。第三十五条 执收单位应当建立健全内部控制制度，接受财政部门和审计机关的监督检查，如实提供非税收入情况和相关资料。"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "监管电话", "tail": "029-89821870"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "责任事项", "tail": "制定方案：制定监督工作规划。实施检查：采取专项监督和日常监督相结合的方式。处置：对于监督对象制定或者执行的规定与国家相关规定相抵触的，根据职权予以纠正或者建议有权机关予以纠正，依法对财政违法行为作出处理处罚。移送：对不属于本部门职权范围的事项，应当按照规定程序移送有权机关处理。事后监管：向业务管理机构或专职监督机构反馈监督结果及意见。对监督对象财政违法行为作出的处理、处罚决定及其执行情况，除涉密外的依法进行公开。其他：对于监督人员与监督对象有利害关系的应当回避；对财政违法行为举报人身份信息予以保密。"}], "output_graph": null, "operation": "add", "triple": {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "责任事项", "tail": "1.制定方案：制定监督工作规划。 2.实施检查：采取专项监督和日常监督相结合的方式。 3.处置：对于监督对象制定或者执行的规定与国家相关规定相抵触的，根据职权予以纠正或者建议有权机关予以纠正，依法对财政违法行为作出处理处罚 4.移送：对不属于本部门职权范围的事项，应当按照规定程序移送有权机关处理。 5.事后监管：向业 适当延长。"}}, {"task": "D", "item_id": "NE-110", "source": "服务事项：对未按规定配备与其规模相适应的医疗器械质量管理机构或者质量管理人员，或者未按规定建立覆盖质量管理全过程的使用质量管理制度的；未按规定由指定的部门或者人员统一采购医疗器械的；购进、使用未备案的第一类医疗器械，或者从未备案的经营企业购进第二类医疗器械的；贮存医疗器械的场所、设施及条件与医疗器械品种、数量不相适应的，或者未按照贮存条件、医疗器械有效期限等要求对贮存的医疗器械进行定期检查并记录的；未按规定建立、执行医疗器械使用前质量检查制度的；未按规定索取、保存医疗器械维护维修相关记录的；未按规定对本单位从事医疗器械维护维修的相关技术人员进行培训考核、建立培训档案的；未按规定对其医疗器械质量管理工作进行自查、形成自查报告的行政处罚。权力类型：行政处罚。行驶主体：西安市市场监督管理局。承办机构：综合执法支队。实施依据：《医疗器械使用质量监督管理办法》（国家食品药品监督管理总局令第18号令公布，自2016年2月1日起施行） 第三十条 医疗器械使用单位有下列情形之一的，由县级以上食品药品监督管理部门责令限期改正，给予警告；拒不改正的，处1万元以下罚款：（一）未按规定配备与其规模相适应的医疗器械质量管理机构或者质量管理人员，或者未按规定建立覆盖质量管理全过程的使用质量管理制度的；（二）未按规定由指定的部门或者人员统一采购医疗器械的；（三）购进、使用未备案的第一类医疗器械，或者从未备案的经营企业购进第二类医疗器械的；（四）贮存医疗器械的场所、设施及条件与医疗器械品种、数量不相适应的，或者未按照贮存条件、医疗器械有效期限等要求对贮存的医疗器械进行定期检查并。监管电话：029-87823020。责任事项：1.立案阶段责任：对经核查有证据初步证明存在违反市场监督管理法律、法规、规章的行为，应当立案查处。 2.调查阶段责任：市场监管部门决定立案查处的案件，应指定两名以上具有行政执法资格的办案人员负责调查处理。办案人员应当全面、客观、公正、及时进行案件调查，收集、调取证据，并依照法律、法规、规章的规定进行检查。 3.审查阶段责任：市场监管部门根据调查取证结果，对案件违法事实、依据、调查取证程序、法律适用、处罚种类和幅度、当事人陈述和申辩理由等方面进行审查，提出处理意见。 4.决定阶段责任：调查审查结束后，调查人员应当将调查审查情况及处理意见报市场监督管理部门负责人审批。情节复杂或者重大违法行为在负责人作出行政处罚决定前应当进行法制审核。立", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [], "output_graph": null, "operation": "add", "triple": {"head": "Document:government-123148e99b2a:对未按规定配备与其规模相适应的医疗器械质量管理机构或者质量管理人员，或者未按规定建立覆盖质量管理全过程的使用质量管理制度的；未按规定由指定的部门或者人员统一采购医疗器械的；购进、使用未备案的第一类医疗", "relation": "权力类型", "tail": "行政处罚"}}, {"task": "D", "item_id": "NE-111", "source": "服务事项：对鉴定人和鉴定机构违法行为的行政处罚。权力类型：行政处罚。行驶主体：西安市司法局。承办机构：司法鉴定管理处。实施依据：《陕西省司法鉴定管理条例》&#40;陕西省人民代表大会常务委员会公告【十一届】第35号&#41;第四十九条:司法鉴定机构有下列情形之一的，由省、设区的市司法行政部门给予警告，责令限期改正；逾期未改正的，处五千元以上二万元以下罚款；情节严重的，责令停业整顿直至由省司法行政部门撤销登记，吊销《司法鉴定许可证》：（一）违反本条例第二十八条规定受理鉴定委托的；（二）出借、出租、涂改、转让《司法鉴定许可证》的；（三）未经登记擅自设立分支机构的；（四）未依法办理变更登记的；（五）组织未取得《司法鉴定人执业证》的人员进行司法鉴定的；（六）无正当理由拒绝受理司法鉴定委托的；（七）支付回扣、介绍费，进行虚假宣传等不正当行为的；（八）拒绝接受司法行政部。监管电话：029-86786795。责任事项：1.立案责任：通过举报、投诉、巡查（或者其他机关移送的违法案件等），发现涉嫌鉴定机构和司法鉴定人在执业过程中存在的违法违规行为的，予以审查，决定是否立案。 2.调查责任：对立案的案件，指定专人负责，及时组织调查取证，通过搜集证据、现场了解核实情况等进行调查，并制作笔录。与 ", "triple": {"head": "Document:government-3973dc6cd196:对涂改、伪造、转让《供血浆证》的处罚", "relation": "实施依据", "tail": "《血液制品管理条例》（国务院令第208号发布，2016年2月6日国务院令第666号修订）第三十七条 涂改、伪造、转让《供血浆证》的，由县级人民政府卫生行政部门收缴《供血浆证》，没收违法所得，并处违法所得3倍以上5倍以下的罚款，没有违法所得的，并处1万元以下的罚款；构成犯罪的，依法追究刑事责任。 《单采血浆站管理办法》（卫生部令第58号发布，2016年1月19日国家卫生和计划生育委员会令第8号第二次修订）第六十五条 涂改、伪造、转让《供血浆证》的，按照《血液制品管理条例》第三十七条规定予以处罚"}}, {"task": "D", "item_id": "NE-158", "source": "服务事项：对直销企业和直销员及其直销活动的监督检查。权力类型：行政检查。行驶主体：西安市市场监督管理局。承办机构：价格与反不正当竞争处。实施依据：《直销管理条例》（国务院令第676号公布，2017.03.01施行） 第三十五条 工商行政管理部门负责对直销企业和直销员及其直销活动实施日常的监督管理。工商行政管理部门可以采取下列措施进行现场检查： &#40;一&#41;进入相关企业进行检查; &#40;二&#41;要求相关企业提供有关文件、资料和证明材料; &#40;三&#41;询问当事人、利害关系人和其他有关人员，并要求其提供有关材料; &#40;四&#41;查阅、复制、查封、扣押相关企业与直销活动有关的材料和非法财物; &#40;五&#41;检查有关人员的直销培训员证、直销员证等证件。 工商行政管理部门依照前款规定进行现场检查时，检查人员不得少于2人，并应当出示合法证件;实施。监管电话：029-88217611。责任事项：1.制定方案：应制定监督检查方案，按照检查周期及频次开展检查。 2.实施检查：执法人员根据相关法律规定及实施方案要求，在职权范围内对辖区内的企业进行检查。 3.处置移送：发现违法行为或线索的，予以立案查处，未发现违法行为或线索的，填写日常检查记录，对发现不属于本部门职权范围、管辖范围的违法线索移交给有关部门。 4.事后监管：对行政检查中发现的问题整改情况进行监督检查。", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-af42e795d1d9:对直销企业和直销员及其直销活动的监督检查", "relation": "服务事项", "tail": "对直销企业和直销员及其直销活动的监督检查"}, {"head": "Document:government-af42e795d1d9:对直销企业和直销员及其直销活动的监督检查", "relation": "权力类型", "tail": "行政检查"}, {"head": "Document:government-af42e795d1d9:对直销企业和直销员及其直销活动的监督检查", "relation": "行驶主体", "tail": "西安市市场监督管理局"}, {"head": "Document:government-af42e795d1d9:对直销企业和直销员及其直销活动的监督检查", "relation": "承办机构", "tail": "价格与反不正当竞争处"}, {"head": "Document:government-af42e795d1d9:对直销企业和直销员及其直销活动的监督检查", "relation": "实施依据", "tail": "《直销管理条例》（国务院令第676号公布，2017.03.01施行）"}, {"head": "Document:government-af42e795d1d9:对直销企业和直销员及其直销活动的监督检查", "relation": "监管电话", "tail": "029-88217611"}, {"head": "Document:government-af42e795d1d9:对直销企业和直销员及其直销活动的监督检查", "relation": "责任事项", "tail": "制定方案：应制定监督检查方案，按照检查周期及频次开展检查"}], "output_graph": null, "operation": "add", "triple": {"head": "Document:government-af42e795d1d9 t:government-6d75a9f8f58a:对危险化学品生产企业有未提供化学品安全技术说明书，或者未在包装（包括外包装件）上粘贴、拴挂化学品安全标签等行为的行政处罚", "relation": "监管电话", "tail": "029-12345 029-12350"}}, {"task": "D", "item_id": "NE-163", "source": "服务事项：对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视频保存时间自直播结束之日起不少于三年的规定的行政处罚。权力类型：行政处罚。行驶主体：西安市市场监督管理局。承办机构：综合执法支队。实施依据：《网络交易监督管理办法》（国家市场监督管理总局令第37号发布，2021.05.01施行） 第四十五条 网络交易经营者违反本办法第二十条，法律、行政法规有规定的，依照其规定；法律、行政法规没有规定的，由市场监督管理部门责令限期改正；逾期不改正的，处一万元以下罚款。 第二十条 通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识。 网络直播服务提供者对网络交易活动的直播视频保存时间自直播结束之日起不少于三年。。监管电话：029-87823020。责任事项：1.立案阶段责任：对经核查有证据初步证明存在违反市场监督管理法律、法规、规章的行为，应当立案查处。 2.调查阶段责任：市场监管部门决定立案查处的案件，应指定两名以上具有行政执法资格的办案人员负责调查处理。办案人员应当全面、客观、公正、及时进行案件调查，收集、调取证据，并依照法律、法规、规章的规定进行检查。 3.审查阶段责任：市场监管部门根据调查取证结果，对案件违法事实、依据、调查取证程序、法律适用、处罚种类和幅度、当事人陈述和申辩理由等方面进行审查，提出处理意见。 4.决定阶段责任：调查审查结束后，调查人员应当将调查审查情况及处理意见报市场监督管理部门负责人审批。情节复杂或者重大违法行为在负责人作出行政处罚决定前应当进行法制审核。立", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [], "output_graph": null, "operation": "add", "triple": {"head": "Document:government-2b05bdf976f6:对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视", "relation": "服务事项", "tail": "对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视频保存时间自直播结束之日起不少于三年的规定的行政处罚"}}, {"task": "D", "item_id": "NE-164", "source": "服务事项：对有色企业使用煤气（天然气）并强制送风的燃烧装置的燃气总管未设置压 力监测报警装置，或者监测报警装置未与紧急自动切断装置联锁的行政处罚。权力类型：行政处罚。行驶主体：市应急管理局。承办机构：市应急管理综合执法支队。实施依据：1.《工贸企业重大事故隐患判定标准》（应急管理部令第10号公布） 第五条 有色企业有下列情形之一的，应当判定为重大事故隐患：（十二）使用煤气（天然气）并强制送风的燃烧装置的燃气总管未设置压力监测报警装置，或者监测报警装置未与紧急自动切断装置联锁的； 2.《中华人民共和国安全生产法》 第九十九条第二项 生产经营单位有下列行为之一的，责令限期改正，处五万元以下的罚款；逾期未改正的，处五万元以上二十万元以下的罚款，对其直接负责的主管人员和其他直接责任人员处一万元以上二万元以下的罚款；情节严重的，责令停产停业整顿；构成犯罪的，依照刑法有关规定追究刑事责任：（二）安全设备的安装、使用、检测、改造和报废不符合国家标准或者行业标准的；。监管电话：029-12345 029-12350。责任事项：1.立案阶段责任：在举报、上级交办、下级报请、事故和监督检查中发现当事人涉嫌违法的，应予以审查，决定是否立案。2.调查阶段责任：对立案的案件，指定专人负责，执法人员不 。实施依据：《互联网视听节目服务管理规定》（2007年12月国家广播电影电视总局、信息产业部令第56号发布 根据2015年8月国家新闻出版广电总局令第3号第一次修正） 第二十三条：违反本规定有下列行为之一的，由县级以上广播电影电视主管部门予以警告、责令改正，可并处3万元以下罚款；同时，可对其主要出资者和经营者予以警告，可并处2万元以下罚款： （一）擅自在互联网上使用广播电视专有名称开展业务的；（二）变更股东、股权结构，或上市融资，或重大资产变动时，未办理审批手续的；（三）未建立健全节目运营规范，未采取版权保护措施，或对传播有害内容未履行提示、删除、报告义务的；（四）未在播出界面显著位置标注播出标识、名称、《许可证》和备案编号的；（五）未履行保留。监管电话：029-87425393。责任事项：1.立案阶段责任，按照线索和初步证据，依法立案。 2.调查阶段责任，调查后提出处理意见，向当事人发出行政处罚事先告知书。 3.审查阶段责任，审查拟处罚决定内容事实依据，如符合听证条件且当事人提出听证要求。按要求组织听证。 4.决定阶段责任，制作书面处罚决定并附送达回证。 5.告知阶段责任，告知申请人享有依法申请行政复议或者提起行政诉讼的权利。 6.送达阶段责任，向行政相对人发送达文书。 7.执行阶段责任，行政相对人执行行政处罚决定。", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [], "output_graph": null, "operation": "add", "triple": {"head": "Document:government-44de83980361:对擅自在互联网上使用广播电视专有名称开展业务；变更股东、股权结构，或上市融资，或重大资产变动时，未办理审批手续；未建立健全节目运营规范，未采取版权保护措施，或对传播有害内容未履行提示、删除、报告义务；", "relation": "权力类型", "tail": "行政处罚"}}, {"task": "D", "item_id": "NE-186", "source": "服务事项：对伪造、变造、倒卖、出租、出借废弃电器电子产品处理资格证书等行为的行政处罚。权力类型：行政处罚。行驶主体：西安市生态环境局。承办机构：市生态环境保护综合执法支队、县（区）生态环境保护综合执法大队。实施依据：1.《废弃电器电子产品处理资格许可管理办法》（环境保护部令第13号，2011年施行）第二十四条 伪造、变造废弃电器电子产品处理资格证书的，由县级以上地方人民政府环境保护主管部门收缴伪造、变造的处理资格证书，处3万元以下罚款；构成违反治安管理行为的，移送公安机关依法予以治安管理处罚；构成犯罪的，移送司法机关依法追究其刑事责任。 倒卖、出租、出借或者以其他形式非法转让废弃电器电子产品处理资格证书的，由县级以上地方人民政府环境保护主管部门责令停止违法行为，限期改正，处3万元以下罚款；情节严重的，由发证机关收回废弃电器电子产品处理资格证书；构成犯罪的，移送司法机关依法追究其刑事责任。。监管电话：029-85392331。责任事项：1、立案阶段责任：行政处罚应当在法定期限内立案； 2、调查阶段责任：对登记立案的环境违法行为，应当全面、客观、公正地调查，收集有关证据； 3、审查阶段责任：作出行政处罚决定前，依法应当进行案件审查，符合法制审核或集体讨论条件的应当及时提交法制审核或集体讨论； 4、告知责任：行政处罚应当告知当事人权利救济途径及方式； 5、决定阶段责任：对于立案的环境行政案件应当在立案之日起九十日内作出处理决定； 6、送达责任：行政处罚决定应当当场交付当事人或在七日内送达当事人； 7、执行阶段责任：当事人到期不缴纳罚款的，可以每日按罚款数额的百分之三加处罚款，加处罚款的数额不得超出罚款的数额；当事人在法定期限内既不提起行政复议或行政诉讼，又不履行处罚决", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-75bedf0d3f3c:对伪造、变造、倒卖、出租、出借废弃电器电子产品处理资格证书等行为的行政处罚", "relation": "服务事项", "tail": "对伪造、变造、倒卖、出租、出借废弃电器电子产品处理资格证书等行为的行政处罚"}, {"head": "Document:government-75bedf0d3f3c:对伪造、变造、倒卖、出租、出借废弃电器电子产品处理资格证书等行为的行 rnment-2fc4dd65e576:对鉴定人和鉴定机构违法行为的行政处罚", "relation": "实施依据", "tail": "《陕西省司法鉴定管理条例》(陕西省人民代表大会常务委员会公告【十一届】第35号)第四十九条"}}, {"task": "E", "item_id": "edit-055", "source": "服务事项：外国人居留许可证核发。权力类型：行政许可。行驶主体：市公安局。承办机构：西安市公安局出入境管理处。实施依据：《中华人民共和国出境入境管理法》第三十条 外国人所持签证注明入境后需要办理居留证件的，应当自入境之日起三十日内，向拟居留地县级以上地方人民政府公安机关出入境管理机构申请办理外国人居留证件。 第三十一条 第二款符合国家规定的专门人才、投资者或者出于人道等原因确需由停留变更为居留的外国人，经设区的市级以上地方人民政府公安机关出入境管理机构批准可以办理外国人居留证件。 《外国人签证证件签发工作规范》第十六条：对外国人所持签证注明入境后需要办理居留证件、符合国家规定的专门人才和投资者以及出于人道和其他合理事由确需由停留变更为居留的，可以签发居留证件。申请材料和签发居留证件要求如下： （一）工作类：持Z字签证入境者应当提交当地人力资源和社会保。监管电话：029-110。责任事项：1．受理阶段责任：在办公场所公示收费标准；一次性告知补正材料；依法受理或不予受理（不予受理应当告知理由）。 2．审核阶段责任：材料审核（包括院校、企事业单位及公民个人出具的函件，我国驻外使领馆为被许可人个人出具的出生证、结婚证等相关资料的认证，并通过面谈、电话询问、实地调查等方式核实申请事由的真实性）；根据材料审核情况提出初审意见。 3．审批阶段责任：作出决定（不予核发居留许可的可不说明理由）；按时办结。 4．制证阶段责任：制发居留许可。 5．事后监督责任：加强证件签发后续管理。 6．其他法律法规政策规定应承担的责任。", "operation": "add", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "服务事项", "tail": "外国人居留许可证核发"}, {"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "权力类型", "tail": "行政许可"}, {"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "行驶主体", "tail": "市公安局"}, {"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "承办机构", "tail": "西安市公安局出入境管理处"}, {"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "实施依据", "tail": "《中华人民共和国出境入境管理法》第三十条、第三十一条；《外国人签证证件签发工作规范》第十六条"}, {"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "监管电话", "tail": "029-110"}, {"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "责任事项", "tail": "受理阶段责任、审核阶段责任、审批阶段责任、制证阶段责任、事后监督责任、其他法律法规政策规定应承担的责任"}], "output_graph": [{"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "服务事项", "tail": "外国人居留许可证核发"}, {"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "权力类型", "tail": "行政许可"}, {"head": "Document:government-3e9dd9632fa8:外国人居留许可证核发", "relation": "行驶主体", "tail": "市公安局"}, {"hea 还；满六个月无人对该财产主张权利或者无法查清权利人的，应当公开拍卖或者按照国家有关规定处理，所得款项上缴国库。 《互联网上。监管电话：029-110。责任事项：1、审查阶段责任：公安机关在检查中发现或者接到举报需对与案件有关的需要作为证据的物品扣押的，应予以审查。 2、告知阶段责任：公安机关在做出行政强制措施决定前，应告知当事人采取行政强制措施的理由、依据以及当事人依法享有的权利和救济途径。 3、执行阶段责任：实施行政强制措施，制作现场笔录，由当事人或见证人、执法人员签名或盖章确认，向当事人送达行政强制措施决定书。 4、其他法律法规规章文件规定应履行的责任。", "operation": "add", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "服务事项", "tail": "扣押涉案的财物"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "权力类型", "tail": "行政强制"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "行驶主体", "tail": "市公安局"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "承办机构", "tail": "各业务部门"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "实施依据", "tail": "《中华人民共和国治安管理处罚法》第八十九条"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "监管电话", "tail": "029-110"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "责任事项", "tail": "审查阶段责任：公安机关在检查中发现或者接到举报需对与案件有关的需要作为证据的物品扣押的，应予以审查"}], "output_graph": [{"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "服务事项", "tail": "扣押涉案的财物"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "权力类型", "tail": "行政强制"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "行驶主体", "tail": "市公安局"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "承办机构", "tail": "各业务部门"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "实施依据", "tail": "《中华人民共和国治安管理处罚法》 第八十九条"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "监管电话", "tail": "029-110"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "责任事项", "tail": "1、审查阶段责任：公安机关在检查中发现或者接到举报需对与案件有关的需要作为证据的物品扣押的，应予以审查。"}], "triple": {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "实施依据", "tail": "《中华人民共和国治安管理处罚法》 第八十九条"}}, {"task": "E", "item_id": "edit-058", "source": "服务事项：对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视频保存时间自直播结束之日起不少于三年的规定的行政处罚。权力类型：行政处罚。行驶主体：西安市市场监督管理局。承办机构：综合执法支队。实施依据：《网络交易监督管理办法》（国家市场监督管理总局令第37号发布，2021.05.01施行） 第四十五条 网络交易经营者违反本办法第二十条，法律、行政法规有规定的，依照其规定；法律、行政法规没有规定的，由市场监督管理部门责令限期改正；逾期不改正的，处一万元以下罚款。 第二十条 通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识。 网络直播服务提供者对网络交易活动的直播视频保存时间自直播结束之日起不少于三年。。监管电话：029-87823020。责任事项：1.立案阶段责任：对经核查有证据初步证明存在违反市场监督管理法律、法规、规章的行为，应当立案查处。 2.调查阶段责任：市场监管部门决定立案查处的案件，应指定两名以上具有行政执法资格的办案人员负责调查处理。办案人员应当全面、客观、公正、及时进行案件调查，收集、调取证据，并依照法律、法规、规章的规定进行检查。 3.审查阶段责任：市场监管部门根据调查取证结果，对案件违法事实、依据、调查取证程序、法律适用、处罚种类和幅度、当事人陈述和申辩理由等方面进行审查，提出处理意见。 4.决定阶段责任：调查审查结束后，调查人员应当将调查审查情况及处理意见报市场监督管理部门负责人审批。情节复杂或者重大违法行为在负责人作出行政处罚决定前应当进行法制审核。立", "operation": "add", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [], "output_graph": [{"head": "Document:government-2b05bdf976f6:对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视", "relation": "服务事项", "tail": "对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视频保存时间自直播结束之日起不少于三年的规定的行政处罚"}, {"head": "Document:government-2b05bdf976f6:对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视", "relation": "权力类型", "tail": "行政处罚"}, {"head": "Document:government-2b05bdf976f6:对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视", "relation": "行驶主体", "tail": "西安市市场监督管理局"}, {"head": "Document:government-2b05bdf976f6:对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视", "relation": "承办机构", "tail": "综合执法支队"}, {"head": "Document:government-2b05bdf976f6:对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视", "relation": "实施依据", "tail": "《网络交易监督管理办法》（国家市场监督管理总局令第37号发布，2021.05.01施行） 第四十五条 网络交易经营者违反本办法第二十条，法律、行政法规有规定的，依照其规定； 、就业和创业指导、人力资源管理咨询、人力资源测评、人力资源培训、承接人力资源服务外包等人力资源服务业务的，应当自开展业务之日起15日内向人力资源社会保障行政部门备案。&rdquo; 《陕西省人力资源市场条例》第二十一条 &ldquo;经营性人力资源服务机构从事下列业务，应当自开展业务之日起十五日内向登记注册地的县（市、区）或者设区的市人力资源社会保障行政部门备案： （一）人力资源供求信息的收集、发布和咨询服务； （二）就业创业指导； （三）人力资源管理咨询服务； （四）人力资源测评；。监管电话：029-86786928。责任事项：1.受理阶段责任：公示应当提交的材料；一次性告知补正材料；依法受理或不予受理（不予受理应当告知理由）。 2.审查阶段责任：审核申报机构提交的材料；结合申报材料和审核意见，提出审查意见。 3.决定阶段责任：依法出具人力资源服务备案回执书。 4.送达阶段责任：核发《人力资源服务备案回执书》并公开信息。 5.事后监管阶段责任：对检查中发现的问题整改情况进行监督检查。", "operation": "add", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-f75d2fddf269:人力资源服务企业备案", "relation": "服务事项", "tail": "人力资源服务企业备案"}, {"head": "Document:government-f75d2fddf269:人力资源服务企业备案", "relation": "权力类型", "tail": "其他权力类型"}, {"head": "Document:government-f75d2fddf269:人力资源服务企业备案", "relation": "行驶主体", "tail": "西安市人力资源和社会保障局"}, {"head": "Document:government-f75d2fddf269:人力资源服务企业备案", "relation": "承办机构", "tail": "人力资源市场处"}, {"head": "Document:government-f75d2fddf269:人力资源服务企业备案", "relation": "实施依据", "tail": "《人力资源市场暂行条例》（2018年6月29日国务院令第700号公布）第十八条第二款"}, {"head": "Document:government-f75d2fddf269:人力资源服务企业备案", "relation": "监管电话", "tail": "029-86786928"}], "output_graph": [{"head": "Document:government-f75d2fddf269:人力资源服务企业备案", "relation": "服务事项", "tail": "人力资源服务企业备案"}, {"head": "Document:government-f75d2fddf269:人力资源服务企业备案", "relation": "权力类型", "tail": "其他权力类型"}, {"head": "Document:government-f75d2fddf269:人力资源服务企业备案", "relation": "行驶主体", "tail": "西安市人力资源和社会保障局"}, {"head": "Document:government-f75d2fddf269:人力资源服务企业备案", "relation": "承办机构", "tail": "人力资源市场处"}, {"head": "Document:government-f75d2fddf269:人力资源服务企业备案", "relation": "实施依据", "tail": "《人力资源市场暂行条例》（2018年6月29日国务院令第700号公布）第十八条第二款"}, {"head": "Document:government-f75d2fddf269:人力资源服务企业备案", "relation": "实施依据", "tail": "《陕西省人力资源市场条例》第二十一条"}, {"head": "Document:government-f75d2fddf269:人力资源服务企业备案", "relation": "监管电话", "tail": "029-86786928"}, {"head": "Document:government-f75d2fddf269:人力资源服务企业备案", "relation": "责任 "source": "服务事项：对政府非税收入政策执行情况的检查。权力类型：行政检查。行驶主体：西安市财政局。承办机构：法规税政处。实施依据：《政府非税收入管理办法》（财税[2016]33号） 第三十四条 各级财政部门应当建立健全非税收入监督管理制度，加强非税收入政策执行情况的监督检查，依法处理非税收入违法违规行为。 第三十五条 执收单位应当建立健全内部控制制度，接受财政部门和审计机关的监督检查，如实提供非税收入情况和相关资料。。监管电话：029-89821870。责任事项：1.制定方案：制定监督工作规划。 2.实施检查：采取专项监督和日常监督相结合的方式。 3.处置：对于监督对象制定或者执行的规定与国家相关规定相抵触的，根据职权予以纠正或者建议有权机关予以纠正，依法对财政违法行为作出处理处罚 4.移送：对不属于本部门职权范围的事项，应当按照规定程序移送有权机关处理。 5.事后监管：向业务管理机构或专职监督机构反馈监督结果及意见。对监督对象财政违法行为作出的处理、处罚决定及其执行情况，除涉密外的依法进行公开。 6.其他：对于监督人员与监督对象有利害关系的应当回避；对财政违法行为举报人身份信息予以保密。", "operation": "remove", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "服务事项", "tail": "对政府非税收入政策执行情况的检查"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "权力类型", "tail": "行政检查"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "行驶主体", "tail": "西安市财政局"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "承办机构", "tail": "法规税政处"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "实施依据", "tail": "《政府非税收入管理办法》（财税[2016]33号）第三十四条 各级财政部门应当建立健全非税收入监督管理制度，加强非税收入政策执行情况的监督检查，依法处理非税收入违法违规行为。第三十五条 执收单位应当建立健全内部控制制度，接受财政部门和审计机关的监督检查，如实提供非税收入情况和相关资料。"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "监管电话", "tail": "029-89821870"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "责任事项", "tail": "制定方案：制定监督工作规划。实施检查：采取专项监督和日常监督相结合的方式。处置：对于监督对象制定或者执行的规定与国家相关规定相抵触的，根据职权予以纠正或者建议有权机关予以纠正，依法对财政违法行为作出处理处罚。移送：对不属于本部门职权范围的事项，应当按照规定程序移送有权机关处理。事后监管：向业务管理机构或专职监督机构反馈监督结果及意见。对监督对象财政违法行为作出的处理、处罚决定及其执行情况，除涉密外的依法进行公开。其他：对于监督人员与监督对象有利害关系的应当回避；对财政违法行为举报人身份信息予以保密。"}], "output_graph": [{"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "服务事项", "tail": "对政府非税收入政策执行情况的检查"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "权力类型", "tail": "行政检查"}, {"head": "Document:government-2259afc0e111:对政府非税收入政 并按程序审批。 3.审查阶段责任：审查调查终结报告，对案件违法事实、证据、调查取证程序、法律适用处罚种类和幅度、当事人陈述申辩理由等方面进行审查，根据不同情况作出决定。 4.告知阶段责任：作出处罚决定前，应制作《行政处罚预先告知书》，送达当事人，告知当事人违法事实、理由及依据，并告知其享有的陈述、申辩、要求听证等权利；符合听证规定，制作并送达《行政处罚听证告", "operation": "add", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [], "output_graph": [{"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "服务事项", "tail": "对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "权力类型", "tail": "行政处罚"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "行驶主体", "tail": "西安市人力资源和社会保障局"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "承办机构", "tail": "劳动保障监察执法处"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "监管电话", "tail": "029-86786928"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "责任事项", "tail": "1.立案阶段责任：发现违法行为，应予以审查，决定是否立案。 2.调查阶段责任：对立案的案件，指定专人负责，执法人员不得少于两人，与当事人有直接利害关系的应当回避。调查时出示执法证件，保障当事人陈述申辩的权利；行政机关在收集证据时，可以采取抽样取证的方法；调查终结后，拟写调查报告，并按程序审批。 3.审查阶段责任：审查调查终结报告，对案件违法事实、证据、调查取证程序、法律适用处罚种类和幅度、当事人陈述申辩理由等方面进行审查，根据不同情况作出决定。 4.告知阶段责任：作出处罚决定前，应制作《行政处罚预先告知书》，送达当事人，告知当事人违法事实、理由及依据，并告知其享有的陈述、申辩、要求听证等权利；符合听证规定，制作并送达《行政处罚听证告"}], "triple": {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "承办机构", "tail": "劳动保障监察执法处"}}, {"task": "E", "item_id": "edit-085", "source": "服务事项：对职业健康检查机构未指定主检医师或者指定的主检医师未取得职业病诊断资格；未按要求建立职业健康检查档案；未履行职业健康检查信息报告义务；未按照相关职业健康监护技术规范规定开展工作的处罚。权力类型：行政处罚。行驶主体：西安市卫生健康委员会。承办机构：职业健康处。实施依据：《职业健康检查管理办法》（国家卫生和计划生育委员会令第5号公布，2019年2月28日国家卫生健康委员会令第4号修订）第二十七条 职业健康检查机构有下列行为之一的，由县级以上地方卫生健康主管部门给予警告，责令限期改正；逾期不改的，处以三万元以下罚款： （一）未指定主检医师或者指定的主检医师未取得职业病诊断资格的； （二）未按要求建立职业健康检查档案的； （三）未履行职业健康检查信息报告义务的； （四）未按照相关职业健康监护技术规范规定开展工作的； （五）违反本办法其他有关规定的。。监管电话：02986787643。责任事项：1.立案责任：发现相关的违规行为，予以审查，决定是否立案。2.调查责任：对立案的案件指定专人负责，及时组织调查取证。3.审查责任：审查调查报告，提出处理意见。4.告知责任：作出行政处罚决定前，应制作《行政处罚告知书》送达当事人，告知违规行为及其享有的陈述、申辩等权利。5.决定责任：制作行政处罚决定书，载明行政处罚告知、当事人陈述申辩等内容。6.送达阶段责任：行政处罚决定书按法律规定的方式送达当事人。7.执行责任：依照已经生效的行政处罚决定执行。8.其他责任：法律法规规章规定应履行的责任。", "operation": "add", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [], "output_graph": [{"head": "Document:government-e9f38f0ecbce:对职业健康检查机构未指定主检医师或者指定的主检医师未取得职业病诊断资格；未按要求建立职业健康检查档案；未履行职业健康检查信息报告义务；未按照相关职业健康监护技术规范规定开展工作的处罚", "relation": "服务事项", "tail": "对职业健康检查机构未指定主检医师或者指定的主检医师未取得职业病诊断资格；未按要求建立职业健康检查档案；未履行职业健康检查信息报告义务；未按照相关职业健康监护技术规范规定开展工作的处罚"}, {"head": "Document:government-e9f38f0ecbce:对职业健康检查机构未指定主检医师或者指定的主检医师未取得职业病诊断资格；未按要求建立职业健康检查档案；未履行职业健康检查信息报告义务；未按照相关职业健康监护技术规范规定开展工作的处罚", "relation": "权力类型", "tail": "行政处罚"}, {"head": "Document:government-e9f38f0ecbce:对职业健康检查机构未指定主检医师或者指定的主检医师未取得职业病诊断资格；未按要求建立职业健康检查档案；未履行职业健康检查信息报告义务；未按照相关职业健康监护技术规范规定开展工作的处罚", "relation": "行驶主体", "tail": "西安市卫生健康委员会"}, {"head": "Document:government-e9f38f0ecbce:对职业健康检查机构未指定主检医师或者指定的主检医师未取得职业病诊断资格；未按要求建立职业健康检查档案；未履行职业健康检查信息报告义务；未按照相关职业健康监护技术规范规定开展工作的处罚", "relation": "承办机构", "tail": "职业健康处"}, {"head": "Document:government-e9f38f0ecbce:对职业健康检查机构未指定主检医师或者指定的主检医师未取得职业病诊断资格；未按要求建立职业健康检查档案；未履行职业健康检查信息报告义务；未按照相关职业健康监护技术规范规定开展工作的处罚", "relation": "实施依据", "tail": "《职业健康检查管理办法》（国家卫生和计划生育委员会令第5号公布，2019年2月28日国家卫生健康委员会令第4号修订）第二十七条"}, {"head": "Document:government-e9f38f0ecbce:对职业健康检查机构未指定主检医师或者指定的主检医师未取得职业病诊断资格；未按要求建立职业健康检查档案；未履行职业健康检查信息报告义务；未按照相关职业健康监护技术规范规定开展工作的处罚", "relation": "监管电话", "tail": "02986787643"}], "triple": {"head": "Document:government-e9f38f0ecbce:对职业健康检查机构未指定主检医师或者指定的主检医师未取得职业病诊断资格；未按要求建立职业健康检查档案；未履行职业健康检查信息报告义务；未按照相关职业健康监护技术规范规定开展工作的处罚", "relation": "权力类型", "tail": "行政处罚"}}, {"task": "E", "item_id": "edit-086", "source": "服务事项：对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视频保存时间自直播结束之日起不少于三年的规定的行政处罚。权力类型：行政处罚。行驶主体：西安市市场监督管理局。承办机构：综合执法支队。实施依据：《网络交易监督管理办法》（国家市场监督管理总局令第37号发布，2021.05.01施行） 第四十五条 网络交易经营者违反本办法第二十条，法律、行政法规有规定的，依照其规定；法律、行政法规没有规定的，由市场监督管理部门责令限期改正；逾期不改正的，处一万元以下罚款。 第二十条 通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识。 网络直播服务提供者对网络交易活动的直播视频保存时间自直播结束之日起不少于三年。。监管电话：029-87823020。责任事项：1.立案阶段责任：对经核查有证据初步证明存在违反市场监督管理法律、法规、规章的行为，应当立案查处。 2.调查阶段责任：市场监管部门决定立案查处的案件，应指定两名以上具有行政执法资格的办案人员负责调查处理。办案人员应当全面、客观、公正、及时进行案件调查，收集、调取证据，并依照法律、法规、规章的规定进行检查。 3.审查阶段责任：市场监管部门根据调查取证结果，对案件违法事实、依据、调查取证程序、法律适用、处罚种类和幅度、当事人陈述和申辩理由等方面进行审查，提出处理意见。 4.决定阶段责任：调查审查结束后，调查人员应当将调查审查情况及处理意见报市场监督管理部门负责人审批。情节复杂或者重大违法行为在负责人作出行政处罚决定前应当进行法制审核。立", "operation": "add", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [], "output_graph": [{"head": "Document:government-2b05bdf976f6:对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视", "relation": "服务事项", "tail": "对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视频保存时间自直播结束之日起不少于三年的规定的行政处罚"}, {"head": "Document:government-2b05bdf976f6:对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视", "relation": "权力类型", "tail": "行政处罚"}, {"head": "Document:government-2b05bdf976f6:对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视", "relation": "行驶主体", "tail": "西安市市场监督管理局"}, {"head": "Document:government-2b05bdf976f6:对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视", "relation": "承办机构", "tail": "综合执法支队"}, {"head": "Document:government-2b05bdf976f6:对违反通过网络社交、网络直播等网络服务开展网络交易活动的网络交易经营者，应当以显著方式展示商品或者服务及其实际经营主体、售后服务等信息，或者上述信息的链接标识；网络直播服务提供者对网络交易活动的直播视", "relation": "实施依据", "tail": "《网络交易监督管理办法》（国家市场监 类型：行政处罚。行驶主体：市级。承办机构：西安市文化市场综合执法支队。实施依据：《互联网视听节目服务管理规定》（2007年12月国家广播电影电视总局、信息产业部令第56号发布 根据2015年8月国家新闻出版广电总局令第3号第一次修正） 第二十三条：违反本规定有下列行为之一的，由县级以上广播电影电视主管部门予以警告、责令改正，可并处3万元以下罚款；同时，可对其主要出资者和经营者予以警告，可并处2万元以下罚款： （一）擅自在互联网上使用广播电视专有名称开展业务的；（二）变更股东、股权结构，或上市融资，或重大资产变动时，未办理审批手续的；（三）未建立健全节目运营规范，未采取版权保护措施，或对传播有害内容未履行提示、删除、报告义务的；（四）未在播出界面显著位置标注播出标识、名称、《许可证》和备案编号的；（五）未履行保留。监管电话：029-87425393。责任事项：1.立案阶段责任，按照线索和初步证据，依法立案。 2.调查阶段责任，调查后提出处理意见，向当事人发出行政处罚事先告知书。 3.审查阶段责任，审查拟处罚决定内容事实依据，如符合听证条件且当事人提出听证要求。按要求组织听证。 4.决定阶段责任，制作书面处罚决定并附送达回证。 5.告知阶段责任，告知申请人享有依法申请行政复议或者提起行政诉讼的权利。 6.送达阶段责任，向行政相对人发送达文书。 7.执行阶段责任，行政相对人执行行政处罚决定。", "operation": "add", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [], "output_graph": [{"head": "Document:government-44de83980361:对擅自在互联网上使用广播电视专有名称开展业务；变更股东、股权结构，或上市融资，或重大资产变动时，未办理审批手续；未建立健全节目运营规范，未采取版权保护措施，或对传播有害内容未履行提示、删除、报告义务；", "relation": "服务事项", "tail": "对擅自在互联网上使用广播电视专有名称开展业务；变更股东、股权结构，或上市融资，或重大资产变动时，未办理审批手续；未建立健全节目运营规范，未采取版权保护措施，或对传播有害内容未履行提示、删除、报告义务；未在播出界面显著位置标注播出标识、名称、《许可证》和备案编号；未履行保留节目记录、向主管部门如实提供查询义务；向未持有《许可证》或备案的单位提供代收费及信号传输、服务器托管等与互联网视听节目服务有关的服务；未履行查验义务，或向互联网视听节目服务单位提供其《许可证》或备案载明事项范围以外的接入服务；进行虚假宣传或者误导用户；未经用户同意，擅自泄露用户信息秘密；互联网视听服务单位在同一年度内三次出现违规行为；拒绝、阻挠、拖延广播电影电视主管"}, {"head": "Document:government-44de83980361:对擅自在互联网上使用广播电视专有名称开展业务；变更股东、股权结构，或上市融资，或重大资产变动时，未办理审批手续；未建立健全节目运营规范，未采取版权保护措施，或对传播有害内容未履行提示、删除、报告义务；", "relation": "权力类型", "tail": "行政处罚"}, {"head": "Document:government-44de83980361:对擅自在互联网上使用广播电视专有名称开展业务；变更股东、股权结构，或上市融资，或重大资产变动时，未办理审批手续；未建立健全节目运营规范，未采取版权保护措施，或对传播有害内容未履行提示、删除、报告义务；", "relation": "行驶主体", "tail": "市级"}, {"head": "Document:government-44de83980361:对擅自在互联网上使用广播电视专有名称开展业务；变更股东、股权结构，或上市融资，或重大资产变动时，未办理审批手续；未建立健全节目运营规范，未采取版权保护措施，或对传播有害内容未履行提示、删除、报告义务；", "relation": "承办机构", "tail": "西安市文化市场综合执法支队"}, {"head": "Document:government-44de83980361:对擅自在互联网上使用广播电视专有名称开展业务；变更股东、股权结构，或上市融资，或重大资产变动时，未办理审批手续；未建立健全节目运营规范，未采取版权保护措施，或对传播有害内容未履行提示、删除、报告义务；", "relation": "实施依据", "tail": "《互联网视听节目服务管理规定》（2007年12月国家广播电影电视总局、信息产业部令 合法制审核或集体讨论条件的应当及时提交法制审核或集体讨论"}, {"head": "Document:government-1872a3147127:对通过逃避监管方式排放污染物的行政处罚", "relation": "责任事项", "tail": "告知责任：行政处罚应当告知当事人权利救济途径及方式"}, {"head": "Document:government-1872a3147127:对通过逃避监管方式排放污染物的行政处罚", "relation": "责任事项", "tail": "决定阶段责任：对于立案的环境行政案件应当在立案之日起九十日内作出处理决定"}, {"head": "Document:government-1872a3147127:对通过逃避监管方式排放污染物的行政处罚", "relation": "责任事项", "tail": "送达责任：行政处罚决定应当当场交付当事人或在七日内送达当事人"}, {"head": "Document:government-1872a3147127:对通过逃避监管方式排放污染物的行政处罚", "relation": "责任事项", "tail": "执行阶段责任：当事人到期不缴纳罚款的，可以每日按罚款数额的百分之三加处罚款，加处罚款的数额不得超出罚款的数额"}], "triple": {"head": "Document:government-1872a3147127:对通过逃避监管方式排放污染物的行政处罚", "relation": "责任事项", "tail": "审查阶段责任：作出行政处罚决定前，依法应当进行案件审查，符合法制审核或集体讨论条件的应当及时提交法制审核或集体讨论"}}, {"task": "E", "item_id": "edit-109", "source": "服务事项：对未按规定配备与其规模相适应的医疗器械质量管理机构或者质量管理人员，或者未按规定建立覆盖质量管理全过程的使用质量管理制度的；未按规定由指定的部门或者人员统一采购医疗器械的；购进、使用未备案的第一类医疗器械，或者从未备案的经营企业购进第二类医疗器械的；贮存医疗器械的场所、设施及条件与医疗器械品种、数量不相适应的，或者未按照贮存条件、医疗器械有效期限等要求对贮存的医疗器械进行定期检查并记录的；未按规定建立、执行医疗器械使用前质量检查制度的；未按规定索取、保存医疗器械维护维修相关记录的；未按规定对本单位从事医疗器械维护维修的相关技术人员进行培训考核、建立培训档案的；未按规定对其医疗器械质量管理工作进行自查、形成自查报告的行政处罚。权力类型：行政处罚。行驶主体：西安市市场监督管理局。承办机构：综合执法支队。实施依据：《医疗器械使用质量监督管理办法》（国家食品药品监督管理总局令第18号令公布，自2016年2月1日起施行） 第三十条 医疗器械使用单位有下列情形之一的，由县级以上食品药品监督管理部门责令限期改正，给予警告；拒不改正的，处1万元以下罚款：（一）未按规定配备与其规模相适应的医疗器械质量管理机构或者质量管理人员，或者未按规定建立覆盖质量管理全过程的使用质量管理制度的；（二）未按规定由指定的部门或者人员统一采购医疗器械的；（三）购进、使用未备案的第一类医疗器械，或者从未备案的经营企业购进第二类医疗器械的；（四）贮存医疗器械的场所、设施及条件与医疗器械品种、数量不相适应的，或者未按照贮存条件、医疗器械有效期限等要求对贮存的医疗器械进行定期检查并。监管电话：029-87823020。责任事项：1.立案阶段责任：对经核查有证据初步证明存在违反市场监督管理法律、法规、规章的行为，应当立案查处。 2.调查阶段责任：市场监管部门决定立案查处的案件，应指定两名以上具有行政执法资格的办案人员负责调查处理。办案人员应当全面、客观、公正、及时进行案件调查，收集、调取证据，并依照法律、法规、规章的规定进行检查。 3.审查阶段责任：市场监管部门根据调查取证结果，对案件违法事实、依据、调查取证程序、法律适用、处罚种类和幅度、当事人陈述和申辩理由等方面进行审查，提出处理意见。 4.决定阶段责任：调查审查结束后，调查人员应当将调查审查情况及处理意见报市场监督管理部门负责人审批。情节复杂或者重大违法行为在负责人作出行政处罚决定前应当进行法制审核。立", "operation": "add", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [], "output_graph": [{"head": "Document:government-123148e99b2a:对未按规定配备与其规模相适应的医疗器 调取证据，并依照法律、法规、规章的规定进行检查。 3.审查阶段责任：市场监管部门根据调查取证结果，对案件违法事实、依据、调查取证程序、法律适用、处罚种类和幅度、当事人陈述和申辩理由等方面进行审查，提出处理意见。 4.决定阶段责任：调查审查结束后，调查人员应当将调查审查情况及处理意见报市场监督管理部门负责人审批。情节复杂或者重大违法行为在负责人作出行政处罚决定前应当进行法制审核。"}}, {"task": "E", "item_id": "edit-110", "source": "服务事项：扣押涉案的财物。权力类型：行政强制。行驶主体：市公安局。承办机构：各业务部门。实施依据：《中华人民共和国治安管理处罚法》 第八十九条 公安机关办理治安案件，对与案件有关的需要作为证据的物品，可以扣押；对被侵害人或者善意第三人合法占有的财产，不得扣押，应当予以登记。对与案件无关的物品，不得扣押。对扣押的物品，应当会同在场见证人和被扣押物品持有人查点清楚，当场开列清单一式二份，由调查人员、见证人和持有人签名或者盖章，一份交给持有人，另一份附卷备查。对扣押的物品，应当妥善保管，不得挪作他用；对不宜长期保存的物品，按照有关规定处理。经查明与案件无关的，应当及时退还；经核实属于他人合法财产的，应当登记后立即退还；满六个月无人对该财产主张权利或者无法查清权利人的，应当公开拍卖或者按照国家有关规定处理，所得款项上缴国库。 《互联网上。监管电话：029-110。责任事项：1、审查阶段责任：公安机关在检查中发现或者接到举报需对与案件有关的需要作为证据的物品扣押的，应予以审查。 2、告知阶段责任：公安机关在做出行政强制措施决定前，应告知当事人采取行政强制措施的理由、依据以及当事人依法享有的权利和救济途径。 3、执行阶段责任：实施行政强制措施，制作现场笔录，由当事人或见证人、执法人员签名或盖章确认，向当事人送达行政强制措施决定书。 4、其他法律法规规章文件规定应履行的责任。", "operation": "add", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "服务事项", "tail": "扣押涉案的财物"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "权力类型", "tail": "行政强制"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "行驶主体", "tail": "市公安局"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "承办机构", "tail": "各业务部门"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "实施依据", "tail": "《中华人民共和国治安管理处罚法》第八十九条"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "监管电话", "tail": "029-110"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "责任事项", "tail": "审查阶段责任：公安机关在检查中发现或者接到举报需对与案件有关的需要作为证据的物品扣押的，应予以审查"}], "output_graph": [{"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "服务事项", "tail": "扣押涉案的财物"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "权力类型", "tail": "行政强制"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "行驶主体", "tail": "市公安局"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "承办机构 -89821870。责任事项：1.制定方案：制定监督工作规划。 2.实施检查：采取专项监督和日常监督相结合的方式。 3.处置：对于监督对象制定或者执行的规定与国家相关规定相抵触的，根据职权予以纠正或者建议有权机关予以纠正，依法对财政违法行为作出处理处罚 4.移送：对不属于本部门职权范围的事项，应当按照规定程序移送有权机关处理。 5.事后监管：向业务管理机构或专职监督机构反馈监督结果及意见。对监督对象财政违法行为作出的处理、处罚决定及其执行情况，除涉密外的依法进行公开。 6.其他：对于监督人员与监督对象有利害关系的应当回避；对财政违法行为举报人身份信息予以保密。", "operation": "remove", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "服务事项", "tail": "对政府非税收入政策执行情况的检查"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "权力类型", "tail": "行政检查"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "行驶主体", "tail": "西安市财政局"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "承办机构", "tail": "法规税政处"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "实施依据", "tail": "《政府非税收入管理办法》（财税[2016]33号）第三十四条 各级财政部门应当建立健全非税收入监督管理制度，加强非税收入政策执行情况的监督检查，依法处理非税收入违法违规行为。第三十五条 执收单位应当建立健全内部控制制度，接受财政部门和审计机关的监督检查，如实提供非税收入情况和相关资料。"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "监管电话", "tail": "029-89821870"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "责任事项", "tail": "制定方案：制定监督工作规划。实施检查：采取专项监督和日常监督相结合的方式。处置：对于监督对象制定或者执行的规定与国家相关规定相抵触的，根据职权予以纠正或者建议有权机关予以纠正，依法对财政违法行为作出处理处罚。移送：对不属于本部门职权范围的事项，应当按照规定程序移送有权机关处理。事后监管：向业务管理机构或专职监督机构反馈监督结果及意见。对监督对象财政违法行为作出的处理、处罚决定及其执行情况，除涉密外的依法进行公开。其他：对于监督人员与监督对象有利害关系的应当回避；对财政违法行为举报人身份信息予以保密。"}], "output_graph": [{"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "服务事项", "tail": "对政府非税收入政策执行情况的检查"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "权力类型", "tail": "行政检查"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "行驶主体", "tail": "西安市财政局"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": "承办机构", "tail": "法规税政处"}, {"head": "Document:government-2259afc0e111:对政府非税收入政策执行情况的检查", "relation": " , "relation": "监管电话", "tail": "029-87823020"}}, {"task": "E", "item_id": "edit-114", "source": "服务事项：对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚。权力类型：行政处罚。行驶主体：西安市人力资源和社会保障局。承办机构：劳动保障监察执法处。实施依据：《中华人民共和国民办教育促进法》第六十二条&ldquo;民办学校有下列行为之一的，由县级以上人民政府教育行政部门、人力资源社会保障行政部门或者其他有关部门责令限期改正，并予以警告；有违法所得的，退还所收费用后没收违法所得；情节严重的，责令停止招生、吊销办学许可证；构成犯罪的，依法追究刑事责任:（一）擅自分立、合并民办学校的；（二）擅自改变民办学校名称、层次、类别和举办者的；（三）公布虚假招生简章或者广告，骗取钱财的；（四）非法颁发或者伪造学历证书、结业证书、培训证书、职业资格证书的；（五）管理混乱严重影响教育教学，产生恶劣社会影响的；（六）提交虚假证明文件或者采取其他欺诈手段隐瞒重要事实骗取办学许可证的；（七）伪造、变造、买卖、出租。监管电话：029-86786928。责任事项：1.立案阶段责任：发现违法行为，应予以审查，决定是否立案。 2.调查阶段责任：对立案的案件，指定专人负责，执法人员不得少于两人，与当事人有直接利害关系的应当回避。调查时出示执法证件，保障当事人陈述申辩的权利；行政机关在收集证据时，可以采取抽样取证的方法；调查终结后，拟写调查报告，并按程序审批。 3.审查阶段责任：审查调查终结报告，对案件违法事实、证据、调查取证程序、法律适用处罚种类和幅度、当事人陈述申辩理由等方面进行审查，根据不同情况作出决定。 4.告知阶段责任：作出处罚决定前，应制作《行政处罚预先告知书》，送达当事人，告知当事人违法事实、理由及依据，并告知其享有的陈述、申辩、要求听证等权利；符合听证规定，制作并送达《行政处罚听证告", "operation": "add", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [], "output_graph": [{"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "服务事项", "tail": "对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "权力类型", "tail": "行政处罚"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "行驶主体", "tail": "西安市人力资源和社会保障局"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "承办机构", "tail": "劳动保障监察执法处"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "监管电话", "tail": "029-86786928"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "责任事项", "tail": "1.立案阶段 133", "source": "服务事项：扣押涉案的财物。权力类型：行政强制。行驶主体：市公安局。承办机构：各业务部门。实施依据：《中华人民共和国治安管理处罚法》 第八十九条 公安机关办理治安案件，对与案件有关的需要作为证据的物品，可以扣押；对被侵害人或者善意第三人合法占有的财产，不得扣押，应当予以登记。对与案件无关的物品，不得扣押。对扣押的物品，应当会同在场见证人和被扣押物品持有人查点清楚，当场开列清单一式二份，由调查人员、见证人和持有人签名或者盖章，一份交给持有人，另一份附卷备查。对扣押的物品，应当妥善保管，不得挪作他用；对不宜长期保存的物品，按照有关规定处理。经查明与案件无关的，应当及时退还；经核实属于他人合法财产的，应当登记后立即退还；满六个月无人对该财产主张权利或者无法查清权利人的，应当公开拍卖或者按照国家有关规定处理，所得款项上缴国库。 《互联网上。监管电话：029-110。责任事项：1、审查阶段责任：公安机关在检查中发现或者接到举报需对与案件有关的需要作为证据的物品扣押的，应予以审查。 2、告知阶段责任：公安机关在做出行政强制措施决定前，应告知当事人采取行政强制措施的理由、依据以及当事人依法享有的权利和救济途径。 3、执行阶段责任：实施行政强制措施，制作现场笔录，由当事人或见证人、执法人员签名或盖章确认，向当事人送达行政强制措施决定书。 4、其他法律法规规章文件规定应履行的责任。", "operation": "remove", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "服务事项", "tail": "扣押涉案的财物"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "权力类型", "tail": "行政强制"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "行驶主体", "tail": "市公安局"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "承办机构", "tail": "各业务部门"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "实施依据", "tail": "《中华人民共和国治安管理处罚法》第八十九条"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "监管电话", "tail": "029-110"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "责任事项", "tail": "审查阶段责任：公安机关在检查中发现或者接到举报需对与案件有关的需要作为证据的物品扣押的，应予以审查"}], "output_graph": [{"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "服务事项", "tail": "扣押涉案的财物"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "权力类型", "tail": "行政强制"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "行驶主体", "tail": "市公安局"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "承办机构", "tail": "各业务部门"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "实施依据", "tail": "《中华人民共和国治安管理处罚法》 第八十九条"}, {"head": "Document:government-28de1bc53024:扣押涉案的财物", "relation": "监管电话", "tail": "029-110"}, { item_id": "edit-142", "source": "服务事项：工伤认定。权力类型：行政确认。行驶主体：西安市人力资源和社会保障局。承办机构：工伤保险处。实施依据：《工伤保险条例》（2003年4月27日国务院令第375号公布，2010年12月20日国务院令第586号修订）第五条&ldquo;国务院社会保险行政部门负责全国的工伤保险工作。 县级以上地方各级人民政府社会保险行政部门负责本行政区域内的工伤保险工作。 社会保险行政部门按照国务院有关规定设立的社会保险经办机构&#40;以下称经办机构&#41;具体承办工伤保险事务。&rdquo; 第十七条&ldquo;职工发生事故伤害或者按照职业病防治法规定被诊断、鉴定为职业病，所在单位应当自事故伤害发生之日或者被诊断、鉴定为职业病之日起30日内，向统筹地区社会保险行政部门提出工伤认定申请。遇有特殊情况，经报社会保险行政部门同意，申请时限可以适当延长。 。监管电话：029-86786928。责任事项：1.受理阶段责任：一次性告知补正材料；依法受理或不予受理（不予受理应当告知理由）。 2.审查阶段责任：根据法定条件和程序对申请人提交的申请材料进行审查。 3.决定阶段责任：出具《认定工伤决定书》或者《不予认定工伤决定书》。 4.送达阶段责任：《认定工伤决定书》和《不予认定工伤决定书》的送达参照民事法律有关送达的规定执行。 5.事后监管阶段责任：法律法规规章文件等规定的应履行的其他责任。", "operation": "add", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-1d0146f05f63:工伤认定", "relation": "服务事项", "tail": "工伤认定"}, {"head": "Document:government-1d0146f05f63:工伤认定", "relation": "权力类型", "tail": "行政确认"}, {"head": "Document:government-1d0146f05f63:工伤认定", "relation": "行驶主体", "tail": "西安市人力资源和社会保障局"}, {"head": "Document:government-1d0146f05f63:工伤认定", "relation": "承办机构", "tail": "工伤保险处"}, {"head": "Document:government-1d0146f05f63:工伤认定", "relation": "实施依据", "tail": "《工伤保险条例》（2003年4月27日国务院令第375号公布，2010年12月20日国务院令第586号修订）第五条、第十七条"}, {"head": "Document:government-1d0146f05f63:工伤认定", "relation": "监管电话", "tail": "029-86786928"}, {"head": "Document:government-1d0146f05f63:工伤认定", "relation": "责任事项", "tail": "受理阶段责任、审查阶段责任、决定阶段责任、送达阶段责任、事后监管阶段责任"}], "output_graph": [{"head": "Document:government-1d0146f05f63:工伤认定", "relation": "服务事项", "tail": "工伤认定"}, {"head": "Document:government-1d0146f05f63:工伤认定", "relation": "权力类型", "tail": "行政确认"}, {"head": "Document:government-1d0146f05f63:工伤认定", "relation": "行驶主体", "tail": "西安市人力资源和社会保障局"}, {"head": "Document:government-1d0146f05f63:工伤认定", "relation": "承办机构", "tail": "工伤保险处"}, {"head": "Document:government-1d0146f05f63:工伤认定", "relation": "实施依据", "tail": "《工伤保险条例》（2003年4月27日国务院令第375号公布，2010年12月20日国务院令第586号修订）第五条"}, {"head": "Document:government-1d01 案。 2.调查阶段责任：对立案的案件，指定专人负责，执法人员不得少于两人，与当事人有直接利害关系的应当回避。调查时出示执法证件，保障当事人陈述申辩的权利；行政机关在收集证据时，可以采取抽样取证的方法；调查终结后，拟写调查报告，并按程序审批。 3.审查阶段责任：审查调查终结报告，对案件违法事实、证据、调查取证程序、法律适用处罚种类和幅度、当事人陈述申辩理由等方面进行审查，根据不同情况作出决定。 4.告知阶段责任：作出处罚决定前，应制作《行政处罚预先告知书》，送达当事人，告知当事人违法事实、理由及依据，并告知其享有的陈述、申辩、要求听证等权利；符合听证规定，制作并送达《行政处罚听证告", "operation": "add", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [], "output_graph": [{"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "服务事项", "tail": "对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "权力类型", "tail": "行政处罚"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "行驶主体", "tail": "西安市人力资源和社会保障局"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "承办机构", "tail": "劳动保障监察执法处"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "监管电话", "tail": "029-86786928"}, {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "责任事项", "tail": "1.立案阶段责任：发现违法行为，应予以审查，决定是否立案。 2.调查阶段责任：对立案的案件，指定专人负责，执法人员不得少于两人，与当事人有直接利害关系的应当回避。调查时出示执法证件，保障当事人陈述申辩的权利；行政机关在收集证据时，可以采取抽样取证的方法；调查终结后，拟写调查报告，并按程序审批。 3.审查阶段责任：审查调查终结报告，对案件违法事实、证据、调查取证程序、法律适用处罚种类和幅度、当事人陈述申辩理由等方面进行审查，根据不同情况作出决定。 4.告知阶段责任：作出处罚决定前，应制作《行政处罚预先告知书》，送达当事人，告知当事人违法事实、理由及依据，并告知其享有的陈述、申辩、要求听证等权利；符合听证规定，制作并送达《行政处罚听证告"}], "triple": {"head": "Document:government-27ceaef34223:对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚", "relation": "服务事项", "tail": "对民办学校未按照国家统一的会计制度进行会计核算、编制财务会计报告，财务、资产管理混乱，或者违反法律、法规增加收费项目、提高收费标准的处罚"}}, {"task": "E", "item_id": "edit-146", "source" "task": "E", "item_id": "edit-173", "source": "服务事项：对有色企业铝加工深井铸造机钢丝卷扬系统选用非钢芯钢丝绳，或者未落实 钢丝绳定期检查、更换制度的行政处罚。权力类型：行政处罚。行驶主体：市应急管理局。承办机构：市应急管理综合执法支队。实施依据：1.《工贸企业重大事故隐患判定标准》（应急管理部令第10号公布） 第五条 有色企业有下列情形之一的，应当判定为重大事故隐患：（十）铝加工深井铸造机钢丝卷扬系统选用非钢芯钢丝绳，或者未落实钢丝绳定期检查、更换制度的； 2.《中华人民共和国安全生产法》 第一百零二条 生产经营单位未采取措施消除事故隐患的，责令立即消除或者限期消除，处五万元以下的罚款；生产经营单位拒不执行的，责令停产停业整顿，对其直接负责的主管人员和其他直接责任人员处五万元以上十万元以下的罚款；构成犯罪的，依照刑法有关规定追究刑事责任。。监管电话：029-12345 029-12350。责任事项：1.立案阶段责任：在举报、上级交办、下级报请、事故和监督检查中发现当事人涉嫌违法的，应予以审查，决定是否立案。2.调查阶段责任：对立案的案件，指定专人负责，执法人员不得少于两人，与当事人有直接利害关系的应当回避。调查时出示执法证件，允许当事人陈述和申辩；行政机关在收集证据时，可以采取抽样取证的方法；调查终结后，拟写调查报告，并按程序审批。3.审查阶段责任：审查调查终结报告，对案件违法事实、证据、调查取证程序、法律适用处罚种类和幅度、当事人陈述申辩理由等方面进行审查，根据不同情况作出决定。4.告知阶段责任：作出处罚决定前，应制作《行政处罚告知书》，送达当事人，告知当事人违法事实、理由及依据，并告知其享有的陈述、申辩、要求听证等权利；符", "operation": "remove", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-1b02073ace3b:对有色企业铝加工深井铸造机钢丝卷扬系统选用非钢芯钢丝绳，或者未落实 钢丝绳定期检查、更换制度的行政处罚", "relation": "服务事项", "tail": "对有色企业铝加工深井铸造机钢丝卷扬系统选用非钢芯钢丝绳，或者未落实 钢丝绳定期检查、更换制度的行政处罚"}, {"head": "Document:government-1b02073ace3b:对有色企业铝加工深井铸造机钢丝卷扬系统选用非钢芯钢丝绳，或者未落实 钢丝绳定期检查、更换制度的行政处罚", "relation": "权力类型", "tail": "行政处罚"}, {"head": "Document:government-1b02073ace3b:对有色企业铝加工深井铸造机钢丝卷扬系统选用非钢芯钢丝绳，或者未落实 钢丝绳定期检查、更换制度的行政处罚", "relation": "行驶主体", "tail": "市应急管理局"}, {"head": "Document:government-1b02073ace3b:对有色企业铝加工深井铸造机钢丝卷扬系统选用非钢芯钢丝绳，或者未落实 钢丝绳定期检查、更换制度的行政处罚", "relation": "承办机构", "tail": "市应急管理综合执法支队"}, {"head": "Document:government-1b02073ace3b:对有色企业铝加工深井铸造机钢丝卷扬系统选用非钢芯钢丝绳，或者未落实 钢丝绳定期检查、更换制度的行政处罚", "relation": "实施依据", "tail": "《工贸企业重大事故隐患判定标准》（应急管理部令第10号公布）第五条"}, {"head": "Document:government-1b02073ace3b:对有色企业铝加工深井铸造机钢丝卷扬系统选用非钢芯钢丝绳，或者未落实 钢丝绳定期检查、更换制度的行政处罚", "relation": "实施依据", "tail": "《中华人民共和国安全生产法》第一百零二条"}, {"head": "Document:government-1b02073ace3b:对有色企业铝加工深井铸造机钢丝卷扬系统选用非钢芯钢丝绳，或者未落实 钢丝绳定期检查、更换制度的行政处罚", "relation": "监管电话", "tail": "029-12345 029-12350"}], "output_graph": [{"head": "Document:government-1b02073ace3b:对有色企业铝加工深井铸造机钢丝卷扬系统选用非钢芯钢 共和国道路运输条例》（国务院令第406号公布，国务院令第764号修订） 第五十三条 县级以上地方人民政府交通运输、公安、市场监督管理等部门应当建立信息共享和协同监管机制，按照职责分工加强对道路运输及相关业务的监督管理。。 第五十八条 县级以上人民政府交通运输主管部门的工作人员应当严格按照职责权限和程序进行监督检查，不得乱设卡、乱收费、乱罚款。 县级以上人民政府交通运输主管部门的工作人员应当重点在道路运输及相关业务经营场所、客货集散地进行监督检查。 县级以上人民政府交通运输主管部门的工作人员在公路路口进行监督检查时，不得随意拦截正常行驶的道路运输车辆。 第六十条 县级以上人民政府交通运输主管部门的工作人员实施监督检查时，。监管电话：029-88220945。责任事项：1.制定方案阶段责任：依据年度计划任务、违法举报和上级交办的任务实施检查。 2.实施检查阶段责任：工作人员应当严格按照职责权限和程序进行监督检查，不得滥用职权、徇私舞弊，不得乱收费、乱罚款。检查情况和处理结果应当记录。 3.处置移送阶段责任：对有问题的检查对象下发处理决定通知。对职权范围外问题移送相关部门。 4.事后监管阶段责任：按照确定的目标、期限、责任，对检查对象予以督促整改、复查。", "operation": "add", "schema": ["服务事项", "权力类型", "行驶主体", "承办机构", "实施依据", "监管电话", "责任事项"], "input_graph": [{"head": "Document:government-6b8726993c79:对道路运输及相关业务及其经营场所、客货集散地的监督检查", "relation": "服务事项", "tail": "对道路运输及相关业务及其经营场所、客货集散地的监督检查"}, {"head": "Document:government-6b8726993c79:对道路运输及相关业务及其经营场所、客货集散地的监督检查", "relation": "权力类型", "tail": "行政检查"}, {"head": "Document:government-6b8726993c79:对道路运输及相关业务及其经营场所、客货集散地的监督检查", "relation": "行驶主体", "tail": "西安市交通运输局"}, {"head": "Document:government-6b8726993c79:对道路运输及相关业务及其经营场所、客货集散地的监督检查", "relation": "承办机构", "tail": "西安市交通运输综合执法支队"}, {"head": "Document:government-6b8726993c79:对道路运输及相关业务及其经营场所、客货集散地的监督检查", "relation": "监管电话", "tail": "029-88220945"}], "output_graph": [{"head": "Document:government-6b8726993c79:对道路运输及相关业务及其经营场所、客货集散地的监督检查", "relation": "服务事项", "tail": "对道路运输及相关业务及其经营场所、客货集散地的监督检查"}, {"head": "Document:government-6b8726993c79:对道路运输及相关业务及其经营场所、客货集散地的监督检查", "relation": "权力类型", "tail": "行政检查"}, {"head": "Document:government-6b8726993c79:对道路运输及相关业务及其经营场所、客货集散地的监督检查", "relation": "行驶主体", "tail": "西安市交通运输局"}, {"head": "Document:government-6b8726993c79:对道路运输及相关业务及其经营场所、客货集散地的监督检查", "relation": "承办机构", "tail": "西安市交通运输综合执法支队"}, {"head": "Document:government-6b8726993c79:对道路运输及相关业务及其经营场所、客货集散地的监督检查", "relation": "实施依据", "tail": "《中华人民共和国道路运输条例》（国务院令第406号公布，国务院令第764号修订）第五十三条、第五十八条、第六十条"}, {"head": "Document:government-6b8726993c79:对道路运输及相关业务及其经营场所、客货集散地的监督检查", "relation": "监管电话", "tail": "029-88220
