<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="685" viewBox="0 0 1000 685" role="img">
<title>Profile-conditioned trial evaluation and edit selection</title><desc>A learned trigger and scope prior condition candidate evaluation. Candidates come from fixed model bundles and detected violations. Each candidate is applied independently to a copy of the current graph. Restoration, regression, density and nonempty-graph checks establish feasibility. The selector commits only the highest positive-utility feasible edit, logs all decisions, and reassesses. Generic trial sketches do not represent measured scores.</desc>
