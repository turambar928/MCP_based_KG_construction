<text x="528" y="513" font-family="Times New Roman" font-size="20" fill="#243447" text-anchor="start" font-weight="normal" font-style="normal">Restoration bounds · bounded component regression</text>
<text x="528" y="540" font-family="Times New Roman" font-size="20" fill="#243447" text-anchor="start" font-weight="normal" font-style="normal">Density bound · nonempty-graph guard</text>
