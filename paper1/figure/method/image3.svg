<rect x="190" y="588" width="620" height="34" rx="0" fill="white" stroke="none" stroke-width="1.3"/>
<text x="500" y="612" font-family="Times New Roman" font-size="21" fill="#39816F" text-anchor="middle" font-weight="normal" font-style="normal">Reassess the committed graph; repeat within the 12-step horizon.</text>
<text x="500" y="645" font-family="Times New Roman" font-size="19" fill="#5B6979" text-anchor="middle" font-weight="normal" font-style="normal">Stop if no eligible edit exists or the 12-step horizon is reached.</text>
<text x="500" y="673" font-family="Times New Roman" font-size="18" fill="#5B6979" text-anchor="middle" font-weight="normal" font-style="normal">Early exit: no supplied candidates, and either a low trigger without hard flags or no detected violations.</text>
