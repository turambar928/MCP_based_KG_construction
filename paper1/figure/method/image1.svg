<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" role="img">
<title>Profile-based sequential repair architecture</title><desc>A document and its field graph are assessed into four quality scores and four graph statistics. A learned router returns a repair trigger and a scope prior. Fixed model proposals and rule-derived edits are evaluated on trial states. One feasible positive-utility edit is committed, then reassessed. Receipt text is a schematic example, not an experimental result.</desc>
