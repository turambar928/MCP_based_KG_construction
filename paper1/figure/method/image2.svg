<circle cx="393" cy="289" r="20" fill="white" stroke="#39816F" stroke-width="1.4"/>
<text x="393" y="295" font-family="Times New Roman" font-size="18" fill="#39816F" text-anchor="middle" font-weight="bold" font-style="normal">d<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
<rect x="527" y="267" width="106" height="43" rx="6" fill="white" stroke="#39816F" stroke-width="1.3"/>
<text x="580" y="294" font-family="Times New Roman" font-size="20" fill="#39816F" text-anchor="middle" font-weight="normal" font-style="normal">ALPHA</text>
<path d="M 415 289 H 519" fill="none" stroke="#B96B33" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#a3)"/>
<text x="467" y="267" font-family="Times New Roman" font-size="20" fill="#B96B33" text-anchor="middle" font-weight="normal" font-style="normal">seller</text>
<rect x="363" y="336" width="275" height="43" rx="5" fill="white" stroke="#B96B33" stroke-width="1.3"/>
<text x="500" y="364" font-family="Times New Roman" font-size="21" fill="#B96B33" text-anchor="middle" font-weight="normal" font-style="normal">seller is not permitted</text>
<path d="M 364 394 H 635" fill="none" stroke="#C5D0DA" stroke-width="1" stroke-linejoin="round"/>
<text x="364" y="424" font-family="Times New Roman" font-size="20" fill="#243447" text-anchor="start" font-weight="normal" font-style="normal">H(t): head matches d<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
<text x="364" y="452" font-family="Times New Roman" font-size="20" fill="#243447" text-anchor="start" font-weight="normal" font-style="normal">R(t): relation is permitted</text>
<text x="364" y="486" font-family="Times New Roman" font-size="18" fill="#39816F" text-anchor="start" font-weight="normal" font-style="normal">Score: rule consistency</text>
<rect x="674" y="188" width="306" height="319" rx="9" fill="#FCF4EB" stroke="#E7D1BC" stroke-width="1.3"/>
<text x="691" y="219" font-family="Times New Roman" font-size="22" fill="#B96B33" text-anchor="start" font-weight="bold" font-style="normal">Value ↔ source text</text>
<rect x="691" y="239" width="271" height="97" rx="6" fill="white" stroke="#C5D0DA" stroke-width="1.3"/>
<path d="M 704 253 V 322" fill="none" stroke="#B96B33" stroke-width="3" stroke-linejoin="round"/>
<text x="716" y="269" font-family="Times New Roman" font-size="20" fill="#B96B33" text-anchor="start" font-weight="bold" font-style="normal">Source excerpt</text>
