<text x="573" y="80" font-family="Times New Roman" font-size="20" fill="#243447" text-anchor="start" font-weight="normal" font-style="normal">Head: d<tspan baseline-shift="sub" font-size="70%">1</tspan>     Relations: merchant, total</text>
<circle cx="31" cy="160" r="11" fill="#316B98" stroke="#316B98" stroke-width="1.4"/>
<text x="31" y="166" font-family="Times New Roman" font-size="17" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="49" y="167" font-family="Times New Roman" font-size="23" fill="#243447" text-anchor="start" font-weight="bold" font-style="normal">Local scope</text>
