<text x="78" y="369" font-family="Times New Roman" font-size="18" fill="#B96B33" text-anchor="middle" font-weight="bold" font-style="normal">u</text>
<text x="113" y="369" font-family="Times New Roman" font-size="19" fill="#B96B33" text-anchor="start" font-weight="normal" font-style="normal">isolated node</text>
<path d="M 38 394 H 308" fill="none" stroke="#C5D0DA" stroke-width="1" stroke-linejoin="round"/>
<text x="38" y="424" font-family="Times New Roman" font-size="19" fill="#243447" text-anchor="start" font-weight="normal" font-style="normal">Repeated fact → duplicate flag</text>
<text x="38" y="452" font-family="Times New Roman" font-size="19" fill="#243447" text-anchor="start" font-weight="normal" font-style="normal">No incident edge → local flag</text>
<text x="38" y="486" font-family="Times New Roman" font-size="18" fill="#316B98" text-anchor="start" font-weight="normal" font-style="normal">Scores: incidence, uniqueness</text>
<rect x="347" y="188" width="306" height="319" rx="9" fill="#EFF7F3" stroke="#C5DBD2" stroke-width="1.3"/>
