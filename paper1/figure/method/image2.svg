<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="615" viewBox="0 0 1000 615" role="img">
<title>Three diagnostic scopes for one document graph</title><desc>Local, graph and source checks inspect the same document graph. A schematic example shows duplicate edges and an isolated node, a relation outside the schema, and a value absent from the source. The results form a shared report. Source occurrence alone is not a relation-level truth test.</desc>
<defs>
<marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243447"/></marker>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#316B98"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#39816F"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B96B33"/></marker>
<marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#766699"/></marker>
<marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B35252"/></marker>
<marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6979"/></marker>
</defs>
<rect width="1000" height="100%" fill="white"/>
<rect x="20" y="17" width="960" height="105" rx="9" fill="#F8FAFC" stroke="#C5D0DA" stroke-width="1.3"/>
<text x="38" y="47" font-family="Times New Roman" font-size="23" fill="#243447" text-anchor="start" font-weight="bold" font-style="normal">One document · three views</text>
<text x="38" y="80" font-family="Times New Roman" font-size="20" fill="#B96B33" text-anchor="start" font-weight="bold" font-style="normal">Source X</text>
<text x="137" y="80" font-family="Times New Roman" font-size="21" fill="#243447" text-anchor="start" font-weight="normal" font-style="normal">Merchant: ALPHA     Total: 42.00</text>
